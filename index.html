<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Private Detective Agency</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #0a192f; color: #ffffff; padding: 20px; text-align: center; }
        .container { max-width: 800px; margin: auto; }
        h1 { color: #c5a059; }
        
        /* Gallery Style */
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 20px; }
        .gallery-item { width: 100%; height: 200px; object-fit: cover; border: 2px solid #c5a059; border-radius: 5px; }
        
        .btn { display: inline-block; padding: 15px 30px; background: #c5a059; color: #0a192f; text-decoration: none; font-weight: bold; border-radius: 5px; margin: 20px 0; }
        footer { margin-top: 40px; font-size: 0.8em; color: #888; }
    </style>
</head>
<body>

<div class="container">
    <h1>GLOBAL PRIVATE DETECTIVE AGENCY</h1>
    <p><em>Discretion • Integrity • Precision</em></p>
    
    <h2>Professional Investigative Services</h2>
    <p>Advanced digital forensics, surveillance, and risk management.</p>

    <a href="mailto:info@yourdomain.com" class="btn">REQUEST CONSULTATION</a>

    <!-- Agency Gallery Section -->
    <h3>Agency Gallery</h3>
    <div class="gallery-grid">
        <img src="images/photo1.jpg" alt="Investigation" class="gallery-item">
        <img src="images/photo2.jpg" alt="Digital Forensics" class="gallery-item">
        <img src="images/photo3.jpg" alt="Surveillance" class="gallery-item">
    </div>

    <footer>
        &copy; 2026 Global Private Detective Agency. All Rights Reserved.
    </footer>
</div>

</body>
</html>
